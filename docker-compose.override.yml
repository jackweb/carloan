# Dev overrides, applied automatically by `docker compose up`.
# Mounts the backend sources into the container and runs uvicorn with --reload.
services:
  backend:
    volumes:
      - ./backend/src:/app/src:ro
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
